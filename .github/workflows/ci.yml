name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub keeps one pending run per group and drops the older, so a push to main would cancel the queued CI of the commit before it; each pushed commit gets its own group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTAINER_SHARDS: "6"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: tests/ci/archive-proxy-test.py
      - run: tests/vm/boot/checks.py

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "5"
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: image
          status: ${{ job.status }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "10"
      - uses: ./.github/actions/build
      # The shards split every test cargo built, so a new test or test file can't fall outside them.
      - id: plan
        run: |
          tests/ci/shard-plan.py plan "$RUNNER_TEMP/build/tests.tsv" tests/ci/test-times.tsv "$CONTAINER_SHARDS" "$RUNNER_TEMP/shards"
          cp "$RUNNER_TEMP/build/tests.tsv" "$RUNNER_TEMP/shards/"
          echo "shards=$(jq -nc --argjson n "$CONTAINER_SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: container-shards
          path: ${{ runner.temp }}/shards
          retention-days: 14
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: build
          status: ${{ job.status }}

  container:
    needs: [image, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "5"
      - uses: actions/download-artifact@v4
        with:
          name: archix-build
          path: ${{ runner.temp }}/build
      - uses: actions/download-artifact@v4
        with:
          name: container-shards
          path: ${{ runner.temp }}/shards
      - run: tests/arch/run.sh
        env:
          ARCHIX_PREBUILT: ${{ runner.temp }}/build
          ARCHIX_TEST_LIST: ${{ runner.temp }}/shards/shard-${{ matrix.shard }}.tsv
          ARCHIX_TEST_RESULTS: ${{ runner.temp }}/results/container-${{ matrix.shard }}.tsv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: container-${{ matrix.shard }}
          status: ${{ job.status }}
          new-files: artifact

  # The shards must between them run every test the build listed exactly once; the archive files they newly cached are saved as one base cache, as the unsharded job saved it.
  container-sum:
    needs: [build, container]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: container-shards
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v4
        with:
          pattern: container-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - run: tests/ci/shard-plan.py check "$RUNNER_TEMP/shards/tests.tsv" "$RUNNER_TEMP"/results/container-*.tsv
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-new-container-*
          path: ${{ runner.temp }}/archive-new
      - id: new
        run: |
          shopt -s nullglob
          tars=("$RUNNER_TEMP"/archive-new/*/archive-new.tar)
          echo "tars=${#tars[@]}" >> "$GITHUB_OUTPUT"
      - if: steps.new.outputs.tars != '0'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/archive/base
          key: archive-base-${{ github.run_id }}
          restore-keys: archive-base-
      - if: steps.new.outputs.tars != '0'
        run: |
          mkdir -p "$RUNNER_TEMP/archive/base"
          for tar in "$RUNNER_TEMP"/archive-new/*/archive-new.tar; do tar -C "$RUNNER_TEMP/archive/base" -xf "$tar"; done
          python3 tests/ci/archive-proxy.py verify "$RUNNER_TEMP/archive/base"
      - if: steps.new.outputs.tars != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/archive/base
          key: archive-base-${{ github.run_id }}-${{ github.run_attempt }}-container

  # The split boot tests (docs/vm-testing.md), two jobs per filesystem, each running its tests side by side as `tests/vm/run.sh boot` does, two at a time; GitHub runs too few jobs at once for one each. A pass is kept in the Actions cache per test with its logs by its inputs' hash, the test image's QEMU, OVMF and swtpm and the runner's kernel among them, so the test is skipped next time whichever job runs it.
  boot:
    needs: [image, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # At most four a job, as tests/ci/boot-results.sh restores and saves four caches; balanced by CI 40649673183's times: revoke (136 s) beside fallback (114), then secureboot (54) and usr-local; layout (95) beside reset-mid-switch (82), then etc-merge (77) and counting (74); file-systems, entry-edit, eject-pending and eject-chroot, added later, not timed on CI yet.
        tests: ["revoke fallback secureboot usr-local", "layout reset-mid-switch etc-merge counting", "file-systems entry-edit eject-pending eject-chroot"]
        fs: [ext4, btrfs]
    name: boot (${{ matrix.tests }}, ${{ matrix.fs }})
    env:
      FS: ${{ matrix.fs }}
    steps:
      - run: echo "ARCHIX_PREBUILT=$RUNNER_TEMP/build" >> "$GITHUB_ENV" && echo "ARCHIX_VM_RESULTS=$RUNNER_TEMP/vm-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: boot
          need-gb: "30"
      - uses: actions/download-artifact@v4
        with:
          name: archix-build
          path: ${{ runner.temp }}/build
      - id: keys
        run: tests/ci/boot-results.sh keys ${{ matrix.tests }}
      # One cache per test, at a path of its own so its key and version don't depend on the grouping; boot-results.sh caps a job at four.
      - if: steps.keys.outputs.test1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test1 }}
          key: ${{ steps.keys.outputs.key1 }}
      - if: steps.keys.outputs.test2
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test2 }}
          key: ${{ steps.keys.outputs.key2 }}
      - if: steps.keys.outputs.test3
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test3 }}
          key: ${{ steps.keys.outputs.key3 }}
      - if: steps.keys.outputs.test4
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test4 }}
          key: ${{ steps.keys.outputs.key4 }}
      - run: tests/ci/boot-results.sh gather
      - run: tests/vm/run.sh boot ${{ matrix.tests }}
      # A test that passed is saved even when another in its job failed.
      - id: split
        if: always() && steps.keys.outcome == 'success'
        run: tests/ci/boot-results.sh split
      - if: always() && steps.split.outputs.save1
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test1 }}
          key: ${{ steps.keys.outputs.key1 }}
      - if: always() && steps.split.outputs.save2
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test2 }}
          key: ${{ steps.keys.outputs.key2 }}
      - if: always() && steps.split.outputs.save3
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test3 }}
          key: ${{ steps.keys.outputs.key3 }}
      - if: always() && steps.split.outputs.save4
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vm-cache/${{ steps.keys.outputs.test4 }}
          key: ${{ steps.keys.outputs.key4 }}
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: boot
          name: boot-${{ steps.keys.outputs.test1 || strategy.job-index }}-${{ matrix.fs }}
          status: ${{ job.status }}

  deploy-boot:
    needs: [image, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        initramfs: [systemd, busybox]
        fs: [ext4, btrfs]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: deploy-boot
          need-gb: "15"
      - uses: actions/download-artifact@v4
        with:
          name: archix-build
          path: ${{ runner.temp }}/build
      - run: tests/vm/deploy-boot/run.sh
        env:
          FS: ${{ matrix.fs }}
          INITRAMFS: ${{ matrix.initramfs }}
          ARCHIX_PREBUILT: ${{ runner.temp }}/build
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: deploy-boot
          name: deploy-boot-${{ matrix.initramfs }}-${{ matrix.fs }}
          status: ${{ job.status }}
