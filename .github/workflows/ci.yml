name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # GitHub keeps one pending run per group and drops the older, so a push to main would cancel the queued CI of the commit before it; each pushed commit gets its own group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: tests/ci/archive-proxy-test.py

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "5"
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: image
          status: ${{ job.status }}

  container:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "5"
      - run: tests/arch/run.sh
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: container
          status: ${{ job.status }}

  boot:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, btrfs]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: boot
          need-gb: "25"
      - run: tests/vm/run.sh boot
        env:
          FS: ${{ matrix.fs }}
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: boot
          name: boot-${{ matrix.fs }}
          status: ${{ job.status }}

  deploy-boot:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        initramfs: [systemd, busybox]
        fs: [ext4, btrfs]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: deploy-boot
          need-gb: "15"
      - run: tests/vm/deploy-boot/run.sh
        env:
          FS: ${{ matrix.fs }}
          INITRAMFS: ${{ matrix.initramfs }}
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: deploy-boot
          name: deploy-boot-${{ matrix.initramfs }}-${{ matrix.fs }}
          status: ${{ job.status }}
