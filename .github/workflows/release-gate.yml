name: Release gate

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      suites:
        description: Tests to run, comma-separated, as suite-test (powercut-pacman, powercut-keep, powercut-varlib, powercut-rootmove, boot-counting, ...); empty runs the power-cut tests, which CI doesn't
        default: ""
      repeat:
        description: How many times to run each test job, side by side, to catch an intermittent failure
        default: "1"
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    if: github.event_name != 'schedule' || github.repository == 'archix-org/archix'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          SUITES: ${{ inputs.suites }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          list() { sed -n "s/^$1_tests=(\(.*\))$/\1/p" tests/vm/run.sh | tr ' ' '\n' | sed "s/^/$1-/"; }
          known=$( { list boot; list powercut; } | paste -sd,)
          default=$(list powercut | paste -sd,)
          echo "tests=$(tr -d ' ' <<< "${SUITES:-$default}" | tr ',' '\n' | grep -v '^$' | jq -Rnc --arg keep "$known" '[inputs | select(. as $s | $keep | split(",") | index($s))]')" >> "$GITHUB_OUTPUT"
          echo "runs=$(jq -nc --argjson n "${REPEAT:-1}" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  # Each test in a job of its own, on btrfs but the ext4 lane's; the power-cut suite builds archix itself, with the test hooks' debug assertions.
  tests:
    needs: plan
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-latest
    # VM_TIMEOUT leaves room under the 6 h job limit for the build and the image before and the log upload after.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.plan.outputs.tests) }}
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: ${{ matrix.test }}
          need-gb: "40"
      - run: |
          suite=${TEST%%-*}
          fs=btrfs
          [ "$TEST" != boot-ext4 ] || fs=ext4
          FS=$fs tests/vm/run.sh "$suite" "${TEST#*-}"
        env:
          TEST: ${{ matrix.test }}
          VM_TIMEOUT: "18000"
          # A gate proves this commit, never a pass recorded for the same inputs earlier.
          ARCHIX_VM_CACHE: "0"
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: ${{ matrix.test }}
          name: ${{ matrix.test }}${{ matrix.run > 1 && format('-{0}', matrix.run) || '' }}
          status: ${{ job.status }}
