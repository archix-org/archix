name: Release gate

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}

jobs:
  image:
    if: github.event_name != 'schedule' || github.repository == 'archix-org/archix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: base
          kvm: "false"
          need-gb: "5"
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: base
          name: gate-image
          status: ${{ job.status }}

  suites:
    needs: image
    runs-on: ubuntu-latest
    # VM_TIMEOUT leaves room under the 6 h job limit for the image build before and the log upload after.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        suite: [rollback, nvidia, cachyos, health, pcr, dkms2, selfupgrade, firewall, churn]
        fs: [ext4, btrfs]
    steps:
      - uses: actions/checkout@v5
        with:
          # selfupgrade builds ARCHIX_OLD from history, which a shallow clone lacks.
          fetch-depth: ${{ matrix.suite != 'selfupgrade' && 1 || 0 }}
      - uses: ./.github/actions/vm-setup
        with:
          group: ${{ matrix.suite }}
          need-gb: "40"
      - run: tests/vm/run.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          FS: ${{ matrix.fs }}
          VM_TIMEOUT: "14400"
          # The oldest commit whose binary can stage a deployment with the chroot /etc-merge fix; HEAD~1 is often a test-only commit with the same binary.
          ARCHIX_OLD: 3a99d0c
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: ${{ matrix.suite }}
          name: ${{ matrix.suite }}-${{ matrix.fs }}
          status: ${{ job.status }}

  powercut:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, btrfs]
        # Each shard logs its own run and checks every third point of it; GitHub's nested boots are about ten times slower than a desktop's, which puts the whole suite near 500 minutes.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vm-setup
        with:
          group: powercut
          need-gb: "60"
      - run: tests/vm/run.sh powercut
        env:
          FS: ${{ matrix.fs }}
          SHARD: ${{ matrix.shard }}/3
      - if: always()
        uses: ./.github/actions/vm-finish
        with:
          group: powercut
          name: powercut-${{ matrix.fs }}-${{ matrix.shard }}
          status: ${{ job.status }}
