name: aur

on:
  push:
    branches: [main]
    paths: ["packaging/aur/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh jq
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish the PKGBUILDs to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          useradd -m builder
          install -d -m 700 -o builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/aur
          # The AUR's published host keys (ED25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          cat > /home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > /home/builder/.ssh/config
          chown -R builder /home/builder/.ssh && chmod 600 /home/builder/.ssh/*
          git config --system --add safe.directory "$PWD"
          chown -R builder "$PWD"
          su builder -c "GH_TOKEN=$GH_TOKEN GITHUB_SHA=$GITHUB_SHA $PWD/packaging/aur/publish.sh archix-git archix archix-bin"
