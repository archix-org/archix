name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: site
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/archix-org/site:${{ github.sha }}
            ghcr.io/archix-org/site:latest
          labels: org.opencontainers.image.source=https://github.com/archix-org/archix
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: archix-org/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Bump the site image
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" apps/site/kustomization.yaml
          git config user.name "archix-bot"
          git config user.email "archix-bot@users.noreply.github.com"
          git commit -am "site: deploy ${GITHUB_SHA::7}"
          git push
