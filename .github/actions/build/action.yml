name: Build archix once
description: Builds the release and static binaries and every test executable in the test image, runs the doc tests, and uploads them as an artifact the test jobs take as ARCHIX_PREBUILT.
inputs:
  name:
    description: The artifact's name, unique in the workflow run (release.yml runs CI and the release gate in one).
    default: archix-build
runs:
  using: composite
  steps:
    # The compiled dependencies and crate registry, keyed on what they're built from; archix itself is always rebuilt.
    - id: cargo
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/cargo
        key: cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/arch/Dockerfile') }}
    - shell: bash
      run: mkdir -p "$RUNNER_TEMP/cargo/target" "$RUNNER_TEMP/cargo/registry" && tests/arch/run.sh
      env:
        ARCHIX_BUILD_OUT: ${{ runner.temp }}/build
        ARCHIX_TARGET_VOLUME: ${{ runner.temp }}/cargo/target
        ARCHIX_CARGO_VOLUME: ${{ runner.temp }}/cargo/registry
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/build
        compression-level: 0
        retention-days: 3
    # The container wrote them as root, some crates' files mode 0600.
    - if: steps.cargo.outputs.cache-hit != 'true'
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cargo"
    - if: steps.cargo.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/cargo
        key: cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/arch/Dockerfile') }}
