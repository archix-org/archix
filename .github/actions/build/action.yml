name: Build archix once
description: Builds the release binary and every test executable in the test image, runs the doc tests, and uploads them as an artifact the test jobs take as ARCHIX_PREBUILT.
inputs:
  name:
    description: The artifact's name, unique in the workflow run (release.yml runs CI and the release gate in one).
    default: archix-build
runs:
  using: composite
  steps:
    # The compiled dependencies and crate registry as one tarball, as the VM's 9p shares keep modes in xattrs actions/cache drops.
    - id: cargo
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/cargo-cache
        key: cargo-xattr-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/arch/Dockerfile') }}
    - shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo/target" "$RUNNER_TEMP/cargo/registry"
        if [ -f "$RUNNER_TEMP/cargo-cache/cargo.tar" ]; then
          tar --xattrs --xattrs-include='user.*' -xpf "$RUNNER_TEMP/cargo-cache/cargo.tar" -C "$RUNNER_TEMP/cargo"
          rm -rf "$RUNNER_TEMP/cargo-cache"
        fi
        tests/arch/run.sh
      env:
        ARCHIX_BUILD_OUT: ${{ runner.temp }}/build
        ARCHIX_TARGET_VOLUME: ${{ runner.temp }}/cargo/target
        ARCHIX_CARGO_VOLUME: ${{ runner.temp }}/cargo/registry
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/build
        compression-level: 0
        retention-days: 3
    - if: steps.cargo.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cargo"
        mkdir -p "$RUNNER_TEMP/cargo-cache"
        tar --xattrs --xattrs-include='user.*' -cf "$RUNNER_TEMP/cargo-cache/cargo.tar" -C "$RUNNER_TEMP/cargo" target registry
    - if: steps.cargo.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/cargo-cache
        key: cargo-xattr-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/arch/Dockerfile') }}
