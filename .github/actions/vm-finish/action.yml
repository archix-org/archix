name: Finish a test runner
description: Stops the archive proxy, saves what it newly cached, and on failure uploads the job's logs (never its disk images).
inputs:
  group:
    description: The archive cache group given to vm-setup.
    required: true
  name:
    description: A name unique to this job, for the cache key and the log artifact.
    required: true
  status:
    description: The job's status so far, job.status.
    required: true
  new-files:
    description: What becomes of newly cached files; "cache" saves the group's cache, "artifact" uploads just them as archive-new-NAME for one job to merge.
    default: cache
runs:
  using: composite
  steps:
    - id: proxy
      if: always()
      shell: bash
      run: tests/ci/proxy-down.sh
    - if: always() && steps.proxy.outputs.new == 'true' && inputs.new-files == 'artifact'
      shell: bash
      run: sort -u "$RUNNER_TEMP/archive-proxy/new" | tar -C "$RUNNER_TEMP/archive/$GROUP" -cf "$RUNNER_TEMP/archive-new.tar" -T -
      env:
        GROUP: ${{ inputs.group }}
    - if: always() && steps.proxy.outputs.new == 'true' && inputs.new-files == 'artifact'
      uses: actions/upload-artifact@v4
      with:
        name: archive-new-${{ inputs.name }}
        path: ${{ runner.temp }}/archive-new.tar
        compression-level: 0
        retention-days: 1
    - if: always() && steps.proxy.outputs.new == 'true' && inputs.new-files == 'cache'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/archive/${{ inputs.group }}
        key: archive-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.name }}
    - if: always() && inputs.status != 'success'
      shell: bash
      run: tests/ci/collect-logs.sh "$RUNNER_TEMP/logs"
    - if: always() && inputs.status != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ inputs.name }}
        path: ${{ runner.temp }}/logs
        if-no-files-found: ignore
        retention-days: 14
