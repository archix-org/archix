[package]
name = "archix"
version = "0.1.0"
edition = "2024"
description = "Declarative, lockable, rollback-able system configuration for Arch Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/archix-org/archix"
homepage = "https://archix.dev"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
libc = "0.2.190"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
