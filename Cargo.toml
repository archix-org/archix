[package]
name = "archix"
version = "0.2.0"
edition = "2024"
description = "Declarative, lockable, rollback-able system configuration for Arch Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/archix-org/archix"
homepage = "https://archix.dev"

[dependencies]
age = { version = "0.12.1", features = ["armor", "plugin", "ssh"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16"
flate2 = "1.1.10"
libc = "0.2.190"
md-5 = "0.11.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = { version = "0.6.0", default-features = false, features = ["password-hash"] }
sha2 = "0.11.1"
strsim = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
ureq = "3.4.2"
yescrypt = { version = "0.1.0", default-features = false, features = ["password-hash"] }
zstd = "0.14.2"

[dev-dependencies]
tempfile = "3.27.0"

# The tests run the debug build, whose unoptimised hashing and zstd decompression took much of the container suite; archix's own code keeps the dev profile.
[profile.dev.package."*"]
opt-level = 3
